<!DOCTYPE html>                                   <!-- mówi przeglądarce, że to nowoczesny HTML5 -->
<html lang="en">                                  <!-- język strony; dla polskiej treści ustaw lang="pl" -->
<head>
    <meta charset="UTF-8">                        <!-- kodowanie znaków, dzięki temu działają polskie litery -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                  <!-- strona skaluje się poprawnie na telefonie -->
    <title>Document</title>                       <!-- tekst na karcie przeglądarki; warto zmienić na własny -->
    <link rel="stylesheet" href="style.css">      <!-- podłącza plik CSS z układem i kolorami -->
</head>
<body>                                            <!-- wszystko, co widać na stronie -->

    <div class="container">                       <!-- główna siatka; CSS ułoży w niej wszystkie dzieci -->

        <header id="header1">                     <!-- nagłówek strony (obszar "header" w CSS) -->
            <h1>Welcome to My Website</h1>        <!-- główny tytuł strony -->
        </header>

        <nav id="nav1">                           <!-- menu nawigacyjne (obszar "nav", lewa kolumna) -->
            <ul>                                  <!-- lista punktowana -->
                <li><a href="#">Home</a></li>     <!-- <li> = jeden punkt listy, <a> = link; href="#" to link zastępczy -->
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <section id="main1">                      <!-- treść główna (obszar "main", środek); w CSS sama jest drugą siatką -->

            <div id="header2"><h1>sahur</h1></div>   <!-- górny pasek treści (obszar "header2") -->

            <article id="article1">               <!-- samodzielny kawałek treści, np. wpis czy artykuł -->
                <h2>Article Title</h2>            <!-- tytuł artykułu -->
                <p>This is the content of the article. It can contain text, images, and other elements.</p>
            </article>                            <!-- <p> = akapit tekstu -->

            <div id="footer2"><h3>tung</h3></div>    <!-- dolny pasek treści (obszar "footer2") -->

        </section>

        <aside id="aside1">                       <!-- panel boczny (obszar "aside", prawa kolumna) -->
            <h2>Sidebar</h2>
            <p>This is the sidebar content.</p>
        </aside>

        <footer id="footer1">                     <!-- stopka strony (obszar "footer", cała szerokość) -->
            <p>&copy; 2024 My Website. All rights reserved.</p>   <!-- &copy; to symbol © -->
        </footer>

    </div>                                        <!-- koniec .container -->

</body>
</html>
